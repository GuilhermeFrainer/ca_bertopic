extends: "datasets/anes.yaml"

experiment:
  name: "anes_opt_mv_spectral_info0"
  description: "Optimizing the parameters for MV Spectral Clustering with info_view=0 on ANES."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "mv_spectral_info0"
  description: "Multi-View Spectral Clustering (info_view=0)"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "multi_view_spectral_clustering"
    params:
      info_view: 0
      n_clusters:
        - 5
        - 10
        - 15
        - 20
        - 25
