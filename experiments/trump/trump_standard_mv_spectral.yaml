extends: "datasets/trump.yaml"

experiment:
  name: "trump_standard_mv_spectral"
  description: "Multi-View Spectral Clustering on trump with standard topic counts."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "mv_spectral"
  description: "Multi-View Spectral Clustering"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      metric: "cosine"
  clustering:
    type: "multi_view_spectral_clustering"
    params:
      n_clusters:
        - 10
        - 20
        - 30
        - 40
        - 50
