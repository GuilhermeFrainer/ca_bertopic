extends: "datasets/trump.yaml"

experiment:
  name: "trump_standard_fast_tritopic"
  description: "Fast TriTopic model (vectorized tri-modal graph topic modeling) on trump dataset with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "fast_tritopic"
  description: "Fast TriTopic multi-view graph topic model with vectorized graph construction."
  type: "fast_tritopic"
  params:
    verbose: false
    n_topics:
      - 10
      - 20
      - 30
      - 40
      - 50
