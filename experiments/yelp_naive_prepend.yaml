extends: "datasets/yelp.yaml"

experiment:
  name: "yelp_naive_prepend"
  description: "Testing the naive approach of prepending the metadata to the document as yaml frontmatter."
  random_state: 36201624

models:
  - id: "baseline"
    description: "Standard BERTopic: no metadata and default hiperparameters."
    is_baseline: true
    dimensionality_reduction:
      type: "umap"
      params:
        min_dist: 0.0
        n_components: 5
        metric: "cosine"
    clustering:
      type: "hdbscan"
      params:
        min_cluster_size: 15
        prediction_data: true
