extends: "datasets/fed.yaml"

experiment:
  name: "fed_opt_pca_mv_co_reg_spectral_info0"
  description: "Optimizing the parameters for PCA + MV Co-Regularized Spectral Clustering with info_view=0."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "pca_mv_co_reg_spectral_info0"
  description: "PCA + Multi-View Co-Regularized Spectral Clustering (info_view=0)"
  dimensionality_reduction:
    type: "pca"
    params:
      n_components: 5
  clustering:
    type: "co_regularized_multi_view_spectral_clustering"
    params:
      info_view: 0
      n_clusters:
        - 50
        - 60
        - 70
        - 80
        - 90
        - 100
        - 110
        - 120
        - 130
        - 140
        - 150
        - 160
        - 170
        - 180
        - 190
        - 200
