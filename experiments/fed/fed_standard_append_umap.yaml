extends: "datasets/fed.yaml"

experiment:
  name: "fed_standard_append_umap"
  description: "Append UMAP model on fed with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "append_umap"
  description: "BERTopic with Append UMAP."
  dimensionality_reduction:
    type: "append_umap"
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "hdbscan"
    params:
      min_cluster_size: 10
      prediction_data: true
      prediction_data: true
  bertopic:
    params:
      nr_topics:
        - 10
        - 20
        - 30
        - 40
        - 50
