extends: "datasets/fed.yaml"

experiment:
  name: "fed_stm_test"
  random_state: 36201624
  prevalence_formula: "~ gdp_monthly + gdp_monthly_lag + gdp_yearly + gdp_yearly_lag + cpi_monthly + cpi_monthly_lag + cpi_yearly + cpi_yearly_lag + funds_rate + funds_rate_lag + unemployment + unemployment_lag + as.factor(type) + as.factor(president) + as.factor(party) + as.factor(fed_chair)"

models:
  - id: "stm_k5"
    parameters:
      k: 5
  - id: "stm_k10"
    parameters:
      k: 10
