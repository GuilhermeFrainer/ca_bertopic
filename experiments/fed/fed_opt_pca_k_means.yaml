extends: "datasets/fed.yaml"

experiment:
  name: "fed_opt_pca_k_means"
  description: "Optimizing the parameters for PCA + K-Means."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "pca_k_means"
  description: "PCA + K-Means"
  dimensionality_reduction:
    type: "pca"
    params:
      n_components: 5
  clustering:
    type: "k_means"
    params:
      n_clusters:
        - 50
        - 60
        - 70
        - 80
        - 90
        - 100
        - 110
        - 120
        - 130
        - 140
        - 150
        - 160
        - 170
        - 180
        - 190
        - 200
