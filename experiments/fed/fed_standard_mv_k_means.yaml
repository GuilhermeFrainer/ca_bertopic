extends: "datasets/fed.yaml"

experiment:
  name: "fed_standard_mv_k_means"
  description: "UMAP + Multi-View K-Means on fed with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "mv_k_means"
  description: "UMAP + Multi-View K-Means"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      metric: "cosine"
  clustering:
    type: "multi_view_k_means"
    params:
      n_clusters:
        - 10
        - 20
        - 30
        - 40
        - 50
