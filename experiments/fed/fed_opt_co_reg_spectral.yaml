extends: "datasets/fed.yaml"

experiment:
  name: "fed_opt_co_reg_spectral"
  description: "Optimizing the parameters for MV Co-Regularized Spectral Clustering."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "mv_co_reg_spectral"
  description: "Multi-View Co-Regularized Spectral Clustering"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "co_regularized_multi_view_spectral_clustering"
    params:
      n_clusters:
        - 50
        - 60
        - 70
        - 80
        - 90
        - 100
        - 110
        - 120
        - 130
        - 140
        - 150
        - 160
        - 170
        - 180
        - 190
        - 200
