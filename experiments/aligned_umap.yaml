experiment:
  name: "aligned_umap"
  description: "Testing AlignedUMAP."
  dataset_path: "data/processed/yelp_reviews_with_embeddings.parquet"
  random_state: 36201624
  sample_size: 10000
  covariates:
    - date
    - stars
    - user_average_stars
    - yelping_since
    - business_stars
  coherence_metrics:
    - u_mass
    - c_v
    - c_npmi
  diversity_metrics:
    - irbo
    - topic_diversity

models:
  - id: "aligned_umap"
    description: "Standard BERTopic with alinged umap"
    dimensionality_reduction:
      type: "aligned_umap"
      params:
        min_dist: 0.0
        n_components: 5
        metric: "cosine"
    clustering:
      type: "hdbscan"
      params:
        min_cluster_size: 15
        prediction_data: true