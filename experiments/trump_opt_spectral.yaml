
experiment:
  name: "trump_opt_spectral"
  description: "Optimizing the parameters for MV Co-Regularized Spectral Clustering."
  dataset_path: "data/processed/trump_embeddings.parquet"
  random_state: 36201624
  decimal_digits: 3
  embedding_col: "clean_text_embedding"
  text_col: "clean_text"
  covariates:
    numerical:
      - log_favorites
      - log_retweets
      - date
    categorical:
      - device
    binary:
      - is_retweet
      - is_deleted
      - is_flagged
  coherence_metrics:
    - u_mass
    - c_v
    - c_npmi
  diversity_metrics:
    - irbo
    - topic_diversity

model:
  id: "mv_co_reg_spectral"
  description: "Multi-View Co-Regularized Spectral Clustering"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "co_regularized_multi_view_spectral_clustering"
    params:
      n_clusters:
        - 75
        - 80
        - 90
        - 100
        - 110
