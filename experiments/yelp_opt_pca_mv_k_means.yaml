extends: "datasets/yelp.yaml"

experiment:
  name: "yelp_opt_pca_mv_k_means"
  description: "Optimizing the parameters for PCA + MV K-Means on Yelp dataset."
  random_state: 36201624
  sample_size: 10000
  decimal_digits: 3

model:
  id: "pca_mv_k_means"
  description: "PCA + MV K-Means"
  dimensionality_reduction:
    type: "pca"
    params:
      n_components: 5
  clustering:
    type: "multi_view_k_means"
    params:
      n_clusters:
        - 75
        - 80
        - 90
        - 100
        - 110
