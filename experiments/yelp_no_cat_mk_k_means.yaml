experiment:
  name: "yelp_no_cat_mv_k_means"
  description: "Testing MV K-Means models"
  dataset_path: "data/processed/yelp_reviews_with_embeddings.parquet"
  random_state: 36201624
  sample_size: 10000
  covariates:
    - date
    - stars
    - user_average_stars
    - yelping_since
    - business_stars
  coherence_metrics:
    - u_mass
    - c_v
    - c_npmi
  diversity_metrics:
    - irbo
    - topic_diversity

models:
  - id: "baseline"
    description: "Standard BERTopic: no metadata and default hiperparameters."
    is_baseline: true
    dimensionality_reduction:
      type: "umap"
      params:
        min_dist: 0.0
        n_components: 5
        metric: "cosine"
    clustering:
      type: "hdbscan"
      params:
        min_cluster_size: 15
        prediction_data: true

  - id: "mv_k_means"
    description: "MV K-Means"
    use_baseline_n_topics: true
    dimensionality_reduction:
      type: "umap"
      params:
        min_dist: 0.0
        n_components: 5
        metric: "cosine"
    clustering:
      type: "multi_view_k_means"
      params:
        n_init: 10

  - id: "mv_spherical_k_means"
    description: "MV Spherical K-Means"
    use_baseline_n_topics: true
    dimensionality_reduction:
      type: "umap"
      params:
        min_dist: 0.0
        n_components: 5
        metric: "cosine"
    clustering:
      type: "multi_view_spherical_k_means"
      params: null