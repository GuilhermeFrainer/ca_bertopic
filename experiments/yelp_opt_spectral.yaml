
extends: "datasets/yelp.yaml"

experiment:
  name: "yelp_opt_spectral"
  description: "Optimizing the parameters for MV Spectral Clustering."
  random_state: 36201624
  sample_size: 10000
  decimal_digits: 3

model:
  id: "mv_co_reg_spectral"
  description: "Multi-View Co-Regularized Spectral Clustering"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "multi_view_spectral_clustering"
    params:
      n_clusters:
        - 75
        - 80
        - 90
        - 100
        - 110
