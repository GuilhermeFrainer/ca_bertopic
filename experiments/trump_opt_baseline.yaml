
experiment:
  name: "trump_opt_baseline"
  description: "Optimizing the parameters for baseline model."
  dataset_path: "data/processed/trump_embeddings.parquet"
  random_state: 36201624
  sample_size: 10000
  decimal_digits: 3
  embedding_col: "clean_text_embedding"
  text_col: "clean_text"
  covariates:
    numerical:
      - log_favorites
      - log_retweets
      - date
    categorical:
      - device
    binary:
      - is_retweet
      - is_deleted
      - is_flagged
  coherence_metrics:
    - u_mass
    - c_v
    - c_npmi
  diversity_metrics:
    - irbo
    - topic_diversity

model:
  id: "baseline"
  description: "Standard BERTopic: no metadata and default hiperparameters."
  is_baseline: true
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components:
        - 5
        - 10
        - 15
      metric: "cosine"
  clustering:
    type: "hdbscan"
    params:
      prediction_data: true
      min_cluster_size: 15
