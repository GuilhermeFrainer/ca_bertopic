extends: "datasets/anes_stemmed.yaml"

experiment:
  name: "anes_opt_stemmed_mv_co_reg_spectral_info0"
  description: "Optimizing the parameters for MV Co-Regularized Spectral Clustering with info_view=0 on ANES."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "stemmed_mv_co_reg_spectral_info0"
  description: "Multi-View Co-Regularized Spectral Clustering (info_view=0)"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "co_regularized_multi_view_spectral_clustering"
    params:
      info_view: 0
      n_clusters:
        - 5
        - 10
        - 15
        - 20
        - 25
