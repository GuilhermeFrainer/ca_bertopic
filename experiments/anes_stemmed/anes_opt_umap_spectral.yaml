extends: "datasets/anes_stemmed.yaml"

experiment:
  name: "anes_opt_stemmed_umap_spectral"
  description: "Optimizing the parameters for UMAP + Single-View Spectral Clustering on ANES."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "stemmed_umap_spectral"
  description: "UMAP + Single-View Spectral Clustering"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "spectral_clustering"
    params:
      n_init: 10
      n_clusters:
        - 5
        - 10
        - 15
        - 20
        - 25
