experiment:
  name: "trump_aligned_umap"
  description: "Testing AlignedUMAP."
  dataset_path: "data/processed/trump_embeddings.parquet"
  random_state: 36201624
  embedding_col: "clean_text_embedding"
  text_col: "clean_text"
  covariates:
    numerical:
      - log_favorites
      - log_retweets
      - date
    categorical:
      - device
    binary:
      - is_retweet
      - is_deleted
      - is_flagged
  coherence_metrics:
    - u_mass
    - c_v
    - c_npmi
  diversity_metrics:
    - irbo
    - topic_diversity

models:
  - id: "aligned_umap"
    description: "Standard BERTopic with alinged umap"
    dimensionality_reduction:
      type: "aligned_umap"
      params:
        min_dist: 0.1
        n_components: 5
        metric: "cosine"
    clustering:
      type: "hdbscan"
      params:
        min_cluster_size: 15
        prediction_data: true