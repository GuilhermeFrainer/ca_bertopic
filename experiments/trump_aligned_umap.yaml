extends: "datasets/trump.yaml"

experiment:
  name: "trump_aligned_umap"
  description: "Testing AlignedUMAP."
  random_state: 36201624

models:
  - id: "aligned_umap"
    description: "Standard BERTopic with alinged umap"
    dimensionality_reduction:
      type: "aligned_umap"
      params:
        min_dist: 0.1
        n_components: 5
        metric: "cosine"
    clustering:
      type: "hdbscan"
      params:
        min_cluster_size: 15
        prediction_data: true
