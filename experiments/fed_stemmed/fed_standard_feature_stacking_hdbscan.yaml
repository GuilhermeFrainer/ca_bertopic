extends: datasets/fed_stemmed.yaml
experiment:
  name: fed_stemmed_standard_baseline
  description: Standard baseline model (simplified UMAP + HDBSCAN) on fed_stemmed
    with standard topic counts.
  random_state:
  - 36201624
  - 62613654
  - 57116123
  decimal_digits: 3
model:
  id: baseline
  description: 'Standard BERTopic: no metadata and default hyperparameters (simplified
    config).'
  is_baseline: false
  dimensionality_reduction:
    type: umap
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "feature_stacking_hdbscan"
    params:
      min_cluster_size: 10
      standardize: true
  bertopic:
    params:
      nr_topics:
      - 10
      - 20
      - 30
      - 40
      - 50
