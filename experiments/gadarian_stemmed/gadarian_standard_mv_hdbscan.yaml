extends: datasets/gadarian_stemmed.yaml
experiment:
  name: gadarian_stemmed_standard_baseline
  description: Standard baseline model (simplified UMAP + HDBSCAN) on gadarian_stemmed
    with standard topic counts.
  random_state:
  - 36201624
  - 62613654
  - 57116123
  decimal_digits: 3
model:
  id: baseline
  description: 'Standard BERTopic: no metadata and default hyperparameters (simplified
    config).'
  is_baseline: false
  dimensionality_reduction:
    type: umap
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "multi_view_hdbscan"
    params:
      min_cluster_size: 5
      fusion: "max"
      scale_views: true
  bertopic:
    params:
      nr_topics:
      - 10
      - 20
      - 30
      - 40
      - 50
