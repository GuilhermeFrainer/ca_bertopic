extends: "datasets/trump.yaml"

experiment:
  name: "trump_opt_mv_spherical_k_means"
  description: "Optimizing the parameters for MV Spherical K-Means Clustering."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "mv_spherical_k_means"
  description: "MV Spherical K-Means"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "multi_view_spherical_k_means"
    params:
      n_clusters:
        - 300
        - 350
        - 400
        - 450
        - 500
        - 550
        - 600
        - 650
        - 700
