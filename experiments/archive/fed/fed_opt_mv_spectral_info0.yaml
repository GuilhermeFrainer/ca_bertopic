extends: "datasets/fed.yaml"

experiment:
  name: "fed_opt_mv_spectral_info0"
  description: "Optimizing the parameters for MV Spectral Clustering with info_view=0."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "mv_spectral_info0"
  description: "Multi-View Spectral Clustering (info_view=0)"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "multi_view_spectral_clustering"
    params:
      info_view: 0
      n_clusters:
        - 50
        - 60
        - 70
        - 80
        - 90
        - 100
        - 110
        - 120
        - 130
        - 140
        - 150
        - 160
        - 170
        - 180
        - 190
        - 200
