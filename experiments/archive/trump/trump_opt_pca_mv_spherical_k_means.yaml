extends: "datasets/trump.yaml"

experiment:
  name: "trump_opt_pca_mv_spherical_k_means"
  description: "Optimizing the parameters for PCA + MV Spherical K-Means."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "pca_mv_spherical_k_means"
  description: "PCA + MV Spherical K-Means"
  dimensionality_reduction:
    type: "pca"
    params:
      n_components: 5
  clustering:
    type: "multi_view_spherical_k_means"
    params:
      n_clusters:
        - 300
        - 350
        - 400
        - 450
        - 500
        - 550
        - 600
        - 650
        - 700
