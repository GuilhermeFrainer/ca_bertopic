extends: "datasets/yelp.yaml"

experiment:
  name: "yelp_opt_umap_spectral"
  description: "Optimizing the parameters for UMAP + Single-View Spectral Clustering."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "umap_spectral"
  description: "UMAP + Single-View Spectral Clustering"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components: 5
      metric: "cosine"
  clustering:
    type: "spectral_clustering"
    params:
      n_init: 10
      n_clusters:
        - 75
        - 80
        - 90
        - 100
        - 110
