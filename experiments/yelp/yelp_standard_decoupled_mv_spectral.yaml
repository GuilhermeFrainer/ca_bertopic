extends: "datasets/yelp.yaml"

experiment:
  name: "yelp_standard_decoupled_mv_spectral"
  description: "UMAP + Decoupled Multi-View Spectral Clustering with explicit Cosine text affinity and Euclidean RBF metadata affinity on Yelp."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "decoupled_mv_spectral"
  description: "UMAP + Decoupled Multi-View Spectral Clustering (Cosine Text + Euclidean RBF Metadata)"
  dimensionality_reduction:
    type: "umap"
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "decoupled_multi_view_spectral_clustering"
    params:
      view_affinities:
        - "cosine"
        - "rbf"
      n_clusters:
        - 10
        - 20
        - 30
        - 40
        - 50
