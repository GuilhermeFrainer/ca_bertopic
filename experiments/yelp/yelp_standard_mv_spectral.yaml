extends: "datasets/yelp.yaml"

experiment:
  name: "yelp_standard_mv_spectral"
  description: "Multi-View Spectral Clustering on yelp with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "mv_spectral"
  description: "Multi-View Spectral Clustering"
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      metric: "cosine"
  clustering:
    type: "multi_view_spectral_clustering"
    params:
      n_clusters:
        - 10
        - 20
        - 30
        - 40
        - 50
