extends: "datasets/yelp.yaml"

experiment:
  name: "yelp_opt_pca_mv_co_reg_spectral"
  description: "Optimizing the parameters for PCA + MV Co-Regularized Spectral Clustering."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "pca_mv_co_reg_spectral"
  description: "PCA + Multi-View Co-Regularized Spectral Clustering"
  dimensionality_reduction:
    type: "pca"
    params:
      n_components: 5
  clustering:
    type: "co_regularized_multi_view_spectral_clustering"
    params:
      n_clusters:
        - 75
        - 80
        - 90
        - 100
        - 110
