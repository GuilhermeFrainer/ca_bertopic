
experiment:
  name: "yelp_opt_baseline"
  description: "Optimizing the parameters for baseline model."
  dataset_path: "data/processed/yelp_embeddings.parquet"
  random_state: 36201624
  sample_size: 10000
  decimal_digits: 3
  embedding_col: "clean_text_embedding"
  text_col: "clean_text"
  covariates:
    numerical:
      - date
      - stars
      - user_average_stars
      - yelping_since
      - business_stars
    categorical:
      - state
  coherence_metrics:
    - u_mass
    - c_v
    - c_npmi
  diversity_metrics:
    - irbo
    - topic_diversity

model:
  id: "baseline"
  description: "Standard BERTopic: no metadata and default hiperparameters."
  is_baseline: true
  dimensionality_reduction:
    type: "umap"
    params:
      min_dist: 0.0
      n_components:
        - 5
        - 10
        - 15
      metric: "cosine"
  clustering:
    type: "hdbscan"
    params:
      min_cluster_size:
        - 5
        - 10
        - 15
        - 20
      prediction_data: true
