dataset_path: "data/processed/yelp_embeddings.parquet"
embedding_col: "clean_text_embedding"
text_col: "clean_text"
covariates:
  numerical:
    - date
    - stars
    - user_average_stars
    - yelping_since
    - business_stars
  categorical:
    - state
coherence_metrics:
  - u_mass
  - c_v
  - c_npmi
diversity_metrics:
  - irbo
  - topic_diversity
