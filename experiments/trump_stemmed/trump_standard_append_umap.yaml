extends: datasets/trump_stemmed.yaml
experiment:
  name: trump_stemmed_standard_append_umap
  description: Append UMAP model on trump_stemmed with standard topic counts.
  random_state:
  - 36201624
  - 62613654
  - 57116123
  decimal_digits: 3
model:
  id: append_umap
  description: BERTopic with Append UMAP.
  dimensionality_reduction:
    type: append_umap
    params:
      min_dist: 0.0
      metric: cosine
  clustering:
    type: hdbscan
    params:
      min_cluster_size: 30
  bertopic:
    params:
      nr_topics:
      - 10
      - 20
      - 30
      - 40
      - 50
