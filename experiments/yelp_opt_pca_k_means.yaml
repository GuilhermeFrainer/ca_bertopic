extends: "datasets/yelp.yaml"

experiment:
  name: "yelp_opt_pca_k_means"
  description: "Optimizing the parameters for PCA + K-Means on Yelp dataset."
  random_state: 36201624
  decimal_digits: 3

model:
  id: "pca_k_means"
  description: "PCA + K-Means"
  dimensionality_reduction:
    type: "pca"
    params:
      n_components: 5
  clustering:
    type: "k_means"
    params:
      n_clusters:
        - 75
        - 80
        - 90
        - 100
        - 110
