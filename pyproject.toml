[project]
name = "ca-bertopic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.0.0",
    "bertopic>=0.17.3",
    "cucim-cu13==25.10.* ; sys_platform == 'linux'",
    "cudf-cu13==25.10.* ; sys_platform == 'linux'",
    "cugraph-cu13==25.10.* ; sys_platform == 'linux'",
    "cuml-cu13==25.10.* ; sys_platform == 'linux'",
    "cuvs-cu13==25.10.* ; sys_platform == 'linux'",
    "cuxfilter-cu13==25.10.* ; sys_platform == 'linux'",
    "dask-cudf-cu13==25.10.* ; sys_platform == 'linux'",
    "fastexcel>=0.19.0",
    "gensim>=4.4.0",
    "great-tables>=0.20.0",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "mvlearn>=0.4.1",
    "nbstripout>=0.8.2",
    "numpy<2.2",
    "nx-cugraph-cu13==25.10.* ; sys_platform == 'linux'",
    "octis>=1.8.3",
    "orjson>=3.10.0",
    "plotly>=6.7.0",
    "kaleido>=1.2.0",
    "polars>=1.35.2",
    "pyarrow>=22.0.0",
    "pylibraft-cu13==25.10.* ; sys_platform == 'linux'",
    "raft-dask-cu13==25.10.* ; sys_platform == 'linux'",
    "rbo>=0.1.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "streamlit>=1.55.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.8.0",
    "tritopic>=2.3.0",
    "marimo>=0.23.16",
]

[project.scripts]
test = "pytest"

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Target version for the generated code
target-version = "py312"

[tool.ruff.lint]
# Enable specific rules or categories
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Ignore "Module level import not at top of file" in scripts where sys.path is manipulated
"scripts/**/*.py" = ["E402"]
"tests/test_find_best_models.py" = ["E402"]
"notebooks/*.ipynb" = ["E402", "F821", "E711", "F811", "E501"]
